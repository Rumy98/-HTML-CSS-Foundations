<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first HTML doc</title>
</head>
<body>
    
    <h2>Fruits in ordered list</h2>
    <ol type="i">
        <li>Apple</li>
        <li>Orange</li>
        <li>Mango</li>
    </ol>
    <h2>Fruits in unordered list</h2>
    <ul type="square">
        <li>Apple</li>
        <li>Orange</li>
        <li>Mango</li>
    </ul>
    <h2>nested list</h2>
    <ol type="1">
        <li>
            Client
            <ul>HTML</ul>
            <UL>CSS</UL>
            <ul>JS</ul>
        </li>
        <li>
            Server
            <ul>
                <li>Node js</li>
                <li>MongoDB</li>
                <li>Express.js</li>
            </ul>
        </li>
    </ol>
    <h2>Definition list</h2>
    <dl>
        <dt>Tea
            <dd>Milky sugary</dd>
        </dt>
        <dt>Coffee
            <dd>Black hot</dd>
        </dt>
    </dl>
</body>
</html>
